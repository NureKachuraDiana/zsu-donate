<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дякуємо!</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6f7fa; color: #121a2b; text-align: center; padding: 20px; }
  h1 { color: #0b2a5b; font-size: 2.4rem; margin: 0 0 8px; }
  p { color: #5b6475; max-width: 40ch; margin: 0 auto 20px; }
  a { display: inline-block; background: #ffd23f; color: #0b2a5b; font-weight: 700; text-decoration: none; padding: 12px 24px; border-radius: 10px; }
</style>
</head>
<body>
  <main>
    <h1 id="title">Перевіряємо платіж…</h1>
    <p id="message">Очікуємо підтвердження WayForPay.</p>
    <a href="/">Повернутися на головну</a>
  </main>
<script>
const order = new URLSearchParams(location.search).get('order');
async function check() {
 try {
  const r = await fetch('/api/status?order='+encodeURIComponent(order));
  const d = await r.json();
  if (!r.ok) throw Error(d.error);
  document.getElementById('title').textContent = d.status === 'Approved' ? 'Платіж успішний!' : d.status === 'Declined' ? 'Платіж відхилено' : 'Платіж не підтверджено';
  document.getElementById('message').textContent = `Статус: ${d.status}. Сума: ${d.amount} грн. Замовлення: ${d.orderReference}.`;
  if (!['Approved','Declined','Expired','Refunded','Voided'].includes(d.status)) setTimeout(check, 5000);
 } catch(e) { document.getElementById('message').textContent = e.message; }
}
check();
</script></body>
</html>
